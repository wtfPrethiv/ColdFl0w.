name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
      # The repository's trailing dot also appears in GITHUB_WORKSPACE. Windows
      # normalizes that path, and checkout validates it before reading `path`.
      - name: Check out Windows source into a safe directory
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'coldflow'
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          git -C $source init
          if ($LASTEXITCODE -ne 0) { throw 'Git initialization failed' }
          git -C $source remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'Adding the remote failed' }
          $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Output "::add-mask::$credential"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $credential"
          try {
            git -C $source -c protocol.version=2 fetch --no-tags --depth=1 origin $env:CHECKOUT_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Fetching the triggering commit failed' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0
          }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checking out the triggering commit failed' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.os == 'Windows' && format('{0}/coldflow/go.mod', runner.temp) || 'go.mod' }}
          cache: ${{ runner.os != 'Windows' }}
      - run: go test -race ./...
        working-directory: ${{ runner.os == 'Windows' && format('{0}/coldflow', runner.temp) || github.workspace }}
      - run: go vet ./...
        working-directory: ${{ runner.os == 'Windows' && format('{0}/coldflow', runner.temp) || github.workspace }}
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coldflow-binaries
          path: dist/
